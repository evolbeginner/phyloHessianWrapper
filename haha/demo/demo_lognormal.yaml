topology:
  method: "yule"
  yule:
    birth_rate: 1.0
  birth_death:
    birth_rate: 1.0
    death_rate: 0.5
    max_attempts: 1000
    max_living_ratio: 10.0

branch_length:
  mode: "custom"
  custom:
    distribution: "lognormal"
    const:
      value: 0.1
    gamma:
      shape: 2.0
      scale: 0.05
    normal:
      mean: 0.1
      std: 0.03
    lognormal:
      mu: -2.5
      sigma: 0.5
    min_length: 0.000001
  process:
    present_extend: true

tree:
  rooted: true
  label_prefix: "taxon"

output:
  format: "newick"
  precision: 6
